/* Fusion: both inputs are consumed; hacked Sahur can never be selected. */
function ownedSlots(){return (me()?.inv||[]).map((v,i)=>v?{v,i}:null).filter(x=>x&&x.v.i!==HACK_ID)}
function renderFusion(){
 const list=ownedSlots(),opts=list.map(x=>`<option value="${x.i}">${esc(SA[x.v.i][0])} · slot ${x.i+1}</option>`).join('')||'<option value="">No eligible Sahurs</option>';
 $('sasFuseA').innerHTML=opts;$('sasFuseB').innerHTML=opts;
 if(list.length>1)$('sasFuseB').selectedIndex=1;
 $('sasFuseOdds').textContent=list.length>1?'Success chance: 65% · higher-tier result':'You need at least two non-Hacked Sahurs.';
}
$('sasFuseA').onchange=$('sasFuseB').onchange=()=>renderFusionOdds();
function renderFusionOdds(){const a=ownedSlots(),x=a.find(z=>z.i===+$('sasFuseA').value),y=a.find(z=>z.i===+$('sasFuseB').value);$('sasFuseOdds').textContent=x&&y&&x.i!==y.i?'Success chance: 65% · result tier improves from your selected pair':'Select two different eligible Sahurs.'}
$('sasFuseBtn').onclick=()=>{
 const m=me(),a=+$('sasFuseA').value,b=+$('sasFuseB').value;if(!m||a===b)return toast('Choose two different Sahurs');
 const x=m.inv[a],y=m.inv[b];if(!x||!y||x.i===HACK_ID||y.i===HACK_ID)return toast('Invalid fusion selection');
 const tier=Math.max(SA[x.i][1],SA[y.i][1]),success=Math.random()<.65;
 const candidates=SA.map((s,i)=>({s,i})).filter(z=>z.i!==HACK_ID&&z.s[1]>tier&&z.s[3]<Infinity);
 const fallback=SA.map((s,i)=>({s,i})).filter(z=>z.i!==HACK_ID&&z.s[1]>=tier);
 const pool=success&&candidates.length?candidates:fallback.length?fallback:[{s:SA[Math.max(0,x.i)],i:Math.max(0,x.i)}];
 const chosen=pool[Math.floor(Math.random()*pool.length)];
 m.inv[a]=null;m.inv[b]={i:chosen.i,r:chosen.s[1]};refresh(m);saveSafe();hud();renderFusion();
 toast(success?'✨ Fusion success! '+chosen.s[0]+' created.':'Fusion unstable — '+chosen.s[0]+' recovered.');
};

let aliases={};
function runCommand(raw){
 if(!adminGuard())return;const parts=raw.trim().replace(/^\//,'').split(/\s+/),cmd=(parts.shift()||'').toLowerCase(),args=parts;
 const arg0=args[0],num=finite(arg0);
 if(cmd==='help')return toast('/clearmy · /clearworld · /spawn ID · /spawnrandom COUNT · /luck MULTIPLIER MINUTES · /cashdrop AMOUNT · /give PLAYER ID · /coins PLAYER AMOUNT · /givecash PLAYER AMOUNT · /givesahur PLAYER ID · /tp PLAYER · /announce TEXT · /event on/off · /day · /night · /fly · /speed N · /status');
 if(aliases[cmd])return runCommand(aliases[cmd]);
 if(cmd==='announce')return announce(args.join(' '),false);

 if(cmd==='give'){
  const target=args[0]==='all'?'all':targetPlayer(args[0]);const id=+(args[0]==='all'?args[1]:args[1]||args[0]);

  const target=args[0]==='all'?'all':targetPlayer(args[0]);const v=finite(args[0]==='all'?args[1]:args[1]||args[0]);(target==='all'?allPlayers():[target||me()]).filter(Boolean).forEach(a=>a.coins+=v);hud();return toast('Coins granted')}
 if(cmd==='tp'){
  if(args[0]==='all'){const dest=targetPlayer(args[1])||me();allPlayers().forEach(a=>{if(a!==dest)a.m.position.copy(dest.m.position)});return toast('Teleported all')}
  const a=targetPlayer(args[0])||me(),b=targetPlayer(args[1])||me();a.m.position.copy(b.m.position);return toast('Teleported '+a.name)}

 if(cmd==='clear'){const a=targetPlayer(args[0])||me();a.inv=a.inv.map(()=>null);refresh(a);return toast('Inventory cleared')}

 if(cmd==='clearmy'||cmd==='clearself')return clearMySahurs();
 if(cmd==='clearworld'||cmd==='clearall'||cmd==='clearallsahurs')return clearAllConveyorSahurs();
 if(cmd==='spawnrandom'){const count=Math.max(1,Math.min(30,Math.floor(num||1)));for(let k=0;k<count;k++){const id=Math.floor(Math.random()*SA.length);spawnConveyor(id)}return toast('Spawned '+count+' random Sahurs')}
 if(cmd==='luck'){const mult=Math.max(1,Math.min(10000,finite(args[0],10))),mins=Math.max(1,Math.min(60,finite(args[1],5)));abuseMult=mult;abuseUntil=Date.now()+mins*60000;$('sasAbuseStatus').textContent='ACTIVE · Luck ×'+fmt2(mult)+' · '+mins+' minutes';return toast('Rare spawn luck ×'+fmt2(mult)+' for '+mins+' minutes')}
 if(cmd==='cashdrop'){const amount=Math.max(1,Math.min(1e12,finite(args[0],1000000)));spawnRewardDrop('cash',amount);return toast('Spawned a '+fmt2(amount)+' cash drop')}
 if(cmd==='status')return toast('Local room · '+allPlayers().length+' player models · '+items.length+' conveyor Sahurs · '+(abuseUntil>Date.now()?'luck event active':'no luck event'));
 if(cmd==='givecash'){const who=args[0]||'me',amount=Math.max(0,finite(args[1]));const a=targetPlayer(who);if(!a)return toast('Player not found');a.coins+=amount;if(a===me())hud();return toast('Granted '+fmt2(amount)+' coins to '+a.name)}
 if(cmd==='givesahur'){const who=args[0]||'me',id=finite(args[1],-1),a=targetPlayer(who);if(!a||!SA[id])return toast('Usage: /givesahur PLAYER SAHUR_ID');const slot=a.inv.indexOf(null);if(slot<0)return toast('Target base is full');a.inv[slot]={i:id,r:SA[id][1]};refresh(a);if(a===me())hud();return toast('Granted '+SA[id][0]+' to '+a.name)}
 return toast('Unknown command · /help');
}

 }
 setInterval(()=>{if(panel.classList.contains('show'))syncStats();const allowed=isAdmin()&&typeof G!=='undefined'&&!!G;dock.style.setProperty('display',allowed?'block':'none','important');dock.style.setProperty('visibility',allowed?'visible':'hidden','important')},700);

 const seen=new Set(),roomKey=()=>{try{return String(window.SASNET?.roomKey?.()||'')}catch{return ''}};let lastRoom='',initialized=false;
